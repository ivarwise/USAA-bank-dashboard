<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>USAA - Admin Live Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #f4f6f8; color: #333; max-width: 1100px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }

    .header {
      background: linear-gradient(180deg, #002244 0%, #003366 100%);
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 18px; font-weight: 700; }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left side - User list */
    .sidebar {
      width: 320px;
      background: white;
      border-right: 1px solid #e1e8ed;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid #e1e8ed;
      font-weight: 700;
      color: #002244;
    }
    .user-list {
      flex: 1;
      overflow-y: auto;
    }
    .user-item {
      padding: 14px 16px;
      border-bottom: 1px solid #f0f4f8;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-item:hover, .user-item.active {
      background: #eef5fc;
    }
    .user-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #002244;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-weight: 600; font-size: 14px; color: #002244; }
    .user-last { font-size: 12px; color: #657786; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Right side - Chat */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #eef2f5;
    }
    .chat-header {
      background: white;
      padding: 14px 18px;
      border-bottom: 1px solid #e1e8ed;
      font-weight: 700;
      color: #002244;
    }
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
    }
    .message.user {
      background: white;
      border: 1px solid #e1e8ed;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .message.admin {
      background: #002244;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .message img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 6px;
      display: block;
    }
    .message-time {
      font-size: 10px;
      margin-top: 4px;
      opacity: 0.7;
    }
    .chat-input-area {
      background: white;
      border-top: 1px solid #e1e8ed;
      padding: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .chat-input {
      flex: 1;
      border: 1px solid #d1dbe5;
      border-radius: 20px;
      padding: 11px 16px;
      font-size: 14px;
      outline: none;
    }
    .send-btn {
      background: #002244;
      color: white;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1><i class="fa-solid fa-headset"></i> USAA Admin Live Chat</h1>
    <span style="font-size:13px;opacity:0.8;">Support Panel</span>
  </div>

  <div class="main">
    <!-- Left: Users -->
    <div class="sidebar">
      <div class="sidebar-header">Conversations</div>
      <div class="user-list" id="userList">
        <div style="padding:20px;text-align:center;color:#64748b;">Loading...</div>
      </div>
    </div>

    <!-- Right: Chat -->
    <div class="chat-panel">
      <div class="chat-header" id="chatHeader">Select a conversation</div>
      <div class="chat-body" id="chatBody">
        <div class="empty-state">Select a user from the left to view and reply to their messages</div>
      </div>
      <div class="chat-input-area" id="inputArea" style="display:none;">
        <input type="text" class="chat-input" id="adminInput" placeholder="Type your reply...">
        <button class="send-btn" onclick="sendAdminReply()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://hzajoriyzowufebetpzv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_2VBan5zlHsacQ4fvsBiBPQ_78oaUVth";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedUserId = null;
    let conversations = [];

    async function init() {
      await loadConversations();
      // Refresh list every 15 seconds
      setInterval(loadConversations, 15000);
    }

    async function loadConversations() {
      // Get distinct users who have messages
      const { data, error } = await client
        .from('chat_messages')
        .select('user_id, message, created_at, sender_type')
        .order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        return;
      }

      // Group by user_id
      const map = new Map();
      data.forEach(msg => {
        if (!map.has(msg.user_id)) {
          map.set(msg.user_id, {
            user_id: msg.user_id,
            lastMessage: msg.message || '[Photo]',
            lastTime: msg.created_at
          });
        }
      });

      conversations = Array.from(map.values());

      const list = document.getElementById('userList');
      if (conversations.length === 0) {
        list.innerHTML = `<div style="padding:20px;text-align:center;color:#64748b;">No conversations yet</div>`;
        return;
      }

      list.innerHTML = conversations.map(c => `
        <div class="user-item ${selectedUserId === c.user_id ? 'active' : ''}" onclick="openConversation('${c.user_id}')">
          <div class="user-avatar">${c.user_id.substring(0,2).toUpperCase()}</div>
          <div class="user-info">
            <div class="user-name">User ${c.user_id.substring(0,8)}...</div>
            <div class="user-last">${c.lastMessage}</div>
          </div>
        </div>
      `).join('');
    }

    async function openConversation(userId) {
      selectedUserId = userId;
      document.getElementById('chatHeader').textContent = `Chat with User ${userId.substring(0,8)}...`;
      document.getElementById('inputArea').style.display = 'flex';

      // Highlight selected
      document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
      event.currentTarget.classList.add('active');

      await loadUserMessages(userId);
    }

    async function loadUserMessages(userId) {
      const { data, error } = await client
        .from('chat_messages')
        .select('*')
        .eq('user_id', userId)
        .order('created_at', { ascending: true });

      const body = document.getElementById('chatBody');
      body.innerHTML = '';

      if (!data || data.length === 0) {
        body.innerHTML = `<div class="empty-state">No messages yet</div>`;
        return;
      }

      data.forEach(msg => {
        const div = document.createElement('div');
        div.className = `message ${msg.sender_type}`;
        let content = msg.message || '';
        if (msg.image_url) {
          content += `<img src="${msg.image_url}">`;
        }
        const time = new Date(msg.created_at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        div.innerHTML = `${content}<div class="message-time">${time}</div>`;
        body.appendChild(div);
      });

      body.scrollTop = body.scrollHeight;
    }

    async function sendAdminReply() {
      if (!selectedUserId) return;
      const input = document.getElementById('adminInput');
      const text = input.value.trim();
      if (!text) return;

      const { error } = await client.from('chat_messages').insert([{
        user_id: selectedUserId,
        sender_type: 'admin',
        message: text
      }]);

      if (error) {
        alert('Error: ' + error.message);
        return;
      }

      input.value = '';
      await loadUserMessages(selectedUserId);
    }

    // Enter key
    document.getElementById('adminInput')?.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendAdminReply();
    });

    init();
  </script>
</body>
</html>
