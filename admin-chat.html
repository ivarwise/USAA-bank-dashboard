<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>USAA - Admin Live Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #f4f6f8; color: #333; max-width: 1100px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }

    .header {
      background: linear-gradient(180deg, #002244 0%, #003366 100%);
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 18px; font-weight: 700; }

    .main { display: flex; flex: 1; overflow: hidden; }

    /* Left sidebar */
    .sidebar {
      width: 340px;
      background: white;
      border-right: 1px solid #e1e8ed;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid #e1e8ed;
      font-weight: 700;
      color: #002244;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .add-btn {
      background: #002244;
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .user-list { flex: 1; overflow-y: auto; }
    .user-item {
      padding: 13px 16px;
      border-bottom: 1px solid #f0f4f8;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s;
    }
    .user-item:hover, .user-item.active { background: #eef5fc; }
    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #002244;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-weight: 600; font-size: 14.5px; color: #002244; }
    .user-last { font-size: 12.5px; color: #657786; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .user-time { font-size: 11px; color: #94a3b8; white-space: nowrap; }

    /* Right chat panel */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #eef2f5;
    }
    .chat-header {
      background: white;
      padding: 14px 18px;
      border-bottom: 1px solid #e1e8ed;
      font-weight: 700;
      color: #002244;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 72%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14.5px;
      line-height: 1.45;
      position: relative;
    }
    .message.user {
      background: white;
      border: 1px solid #e1e8ed;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .message.admin {
      background: #002244;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .message img {
      max-width: 220px;
      border-radius: 8px;
      margin-top: 6px;
      display: block;
    }
    .message-time {
      font-size: 10.5px;
      margin-top: 4px;
      opacity: 0.7;
    }
    .chat-input-area {
      background: white;
      border-top: 1px solid #e1e8ed;
      padding: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .chat-input {
      flex: 1;
      border: 1px solid #d1dbe5;
      border-radius: 22px;
      padding: 11px 16px;
      font-size: 14.5px;
      outline: none;
    }
    .send-btn {
      background: #002244;
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 15px;
      text-align: center;
      padding: 20px;
    }

    /* Modal for selecting any user */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: white;
      width: 90%;
      max-width: 400px;
      border-radius: 14px;
      overflow: hidden;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 16px;
      border-bottom: 1px solid #e1e8ed;
      font-weight: 700;
      color: #002244;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body { overflow-y: auto; flex: 1; }
    .modal-user {
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid #f0f4f8;
    }
    .modal-user:hover { background: #f8fafc; }
  </style>
</head>
<body>

  <div class="header">
    <h1><i class="fa-solid fa-headset"></i> USAA Admin Live Chat</h1>
    <span style="font-size:13px;opacity:0.8;">Support Panel</span>
  </div>

  <div class="main">
    <!-- Left: Conversations -->
    <div class="sidebar">
      <div class="sidebar-header">
        <span>Conversations</span>
        <button class="add-btn" onclick="openUserPicker()" title="Start new chat">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
      <div class="user-list" id="userList">
        <div style="padding:20px;text-align:center;color:#64748b;">Loading...</div>
      </div>
    </div>

    <!-- Right: Chat -->
    <div class="chat-panel">
      <div class="chat-header" id="chatHeader">Select a conversation</div>
      <div class="chat-body" id="chatBody">
        <div class="empty-state">Select a user from the left<br>or click + to start a new chat</div>
      </div>
      <div class="chat-input-area" id="inputArea" style="display:none;">
        <input type="text" class="chat-input" id="adminInput" placeholder="Type your reply...">
        <button class="send-btn" onclick="sendAdminReply()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <!-- User Picker Modal -->
  <div class="modal-overlay" id="userPicker">
    <div class="modal">
      <div class="modal-header">
        <span>Select User</span>
        <button onclick="closeUserPicker()" style="background:none;border:none;font-size:18px;cursor:pointer;">✕</button>
      </div>
      <div class="modal-body" id="allUsersList">
        <div style="padding:20px;text-align:center;color:#64748b;">Loading users...</div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://hzajoriyzowufebetpzv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_2VBan5zlHsacQ4fvsBiBPQ_78oaUVth";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedUserId = null;
    let selectedUserName = "User";
    let profilesMap = {};   // user_id → profile

    async function init() {
      await loadAllProfiles();
      await loadConversations();

      // Realtime: new messages
      client
        .channel('admin-chat')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
          loadConversations();
          if (selectedUserId && payload.new.user_id === selectedUserId) {
            loadUserMessages(selectedUserId);
          }
        })
        .subscribe();
    }

    async function loadAllProfiles() {
      const { data } = await client.from('profiles').select('id, full_name, email');
      profilesMap = {};
      (data || []).forEach(p => {
        profilesMap[p.id] = p;
      });
    }

    function getUserName(userId) {
      const p = profilesMap[userId];
      if (p && p.full_name) return p.full_name;
      if (p && p.email) return p.email;
      return "User " + userId.substring(0, 8);
    }

    function getInitials(name) {
      if (!name) return "US";
      const parts = name.trim().split(" ");
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return name.substring(0, 2).toUpperCase();
    }

    async function loadConversations() {
      const { data, error } = await client
        .from('chat_messages')
        .select('user_id, message, created_at, sender_type, image_url')
        .order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        return;
      }

      // Group by user_id (latest message first)
      const map = new Map();
      (data || []).forEach(msg => {
        if (!map.has(msg.user_id)) {
          map.set(msg.user_id, {
            user_id: msg.user_id,
            lastMessage: msg.message || (msg.image_url ? '[Photo]' : ''),
            lastTime: msg.created_at
          });
        }
      });

      const conversations = Array.from(map.values());

      const list = document.getElementById('userList');
      if (conversations.length === 0) {
        list.innerHTML = `<div style="padding:20px;text-align:center;color:#64748b;">No conversations yet<br><small>Click + to start one</small></div>`;
        return;
      }

      list.innerHTML = conversations.map(c => {
        const name = getUserName(c.user_id);
        const time = new Date(c.lastTime).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        return `
          <div class="user-item ${selectedUserId === c.user_id ? 'active' : ''}" onclick="openConversation('${c.user_id}')">
            <div class="user-avatar">${getInitials(name)}</div>
            <div class="user-info">
              <div class="user-name">${name}</div>
              <div class="user-last">${c.lastMessage}</div>
            </div>
            <div class="user-time">${time}</div>
          </div>
        `;
      }).join('');
    }

    async function openConversation(userId) {
      selectedUserId = userId;
      selectedUserName = getUserName(userId);

      document.getElementById('chatHeader').innerHTML = `
        <div class="user-avatar" style="width:36px;height:36px;font-size:13px;">${getInitials(selectedUserName)}</div>
        <span>${selectedUserName}</span>
      `;
      document.getElementById('inputArea').style.display = 'flex';

      // Highlight in list
      document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
      // We re-render list so active class is applied on next loadConversations, but for now:
      await loadUserMessages(userId);
      await loadConversations(); // refresh list to show active
    }

    async function loadUserMessages(userId) {
      const { data, error } = await client
        .from('chat_messages')
        .select('*')
        .eq('user_id', userId)
        .order('created_at', { ascending: true });

      const body = document.getElementById('chatBody');
      body.innerHTML = '';

      if (error) {
        body.innerHTML = `<div class="empty-state">Error loading messages</div>`;
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        body.innerHTML = `<div class="empty-state">No messages yet with this user</div>`;
        return;
      }

      data.forEach(msg => {
        const div = document.createElement('div');
        div.className = `message ${msg.sender_type === 'admin' ? 'admin' : 'user'}`;
        
        let content = msg.message ? msg.message.replace(/\n/g, '<br>') : '';
        if (msg.image_url) {
          content += `<img src="${msg.image_url}" alt="photo">`;
        }
        const time = new Date(msg.created_at).toLocaleString('en-US', { 
          month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' 
        });
        
        div.innerHTML = `${content}<div class="message-time">${time}</div>`;
        body.appendChild(div);
      });

      body.scrollTop = body.scrollHeight;

      // Mark user messages as read
      await client
        .from('chat_messages')
        .update({ is_read: true })
        .eq('user_id', userId)
        .eq('sender_type', 'user')
        .eq('is_read', false);
    }

    async function sendAdminReply() {
      if (!selectedUserId) return;
      const input = document.getElementById('adminInput');
      const text = input.value.trim();
      if (!text) return;

      const { error } = await client.from('chat_messages').insert([{
        user_id: selectedUserId,
        sender_type: 'admin',
        message: text,
        is_read: false
      }]);

      if (error) {
        alert('Error sending reply: ' + error.message);
        return;
      }

      input.value = '';
      await loadUserMessages(selectedUserId);
      await loadConversations();
    }

    // ===== User Picker (the + button) =====
    async function openUserPicker() {
      document.getElementById('userPicker').style.display = 'flex';
      
      const { data } = await client.from('profiles').select('id, full_name, email').order('full_name');
      const list = document.getElementById('allUsersList');
      
      if (!data || data.length === 0) {
        list.innerHTML = `<div style="padding:20px;text-align:center;">No users found</div>`;
        return;
      }

      list.innerHTML = data.map(p => {
        const name = p.full_name || p.email || p.id.substring(0,8);
        return `
          <div class="modal-user" onclick="startChatWith('${p.id}')">
            <div class="user-avatar">${getInitials(name)}</div>
            <div>
              <div class="user-name">${name}</div>
              <div class="user-last">${p.email || ''}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function closeUserPicker() {
      document.getElementById('userPicker').style.display = 'none';
    }

    async function startChatWith(userId) {
      closeUserPicker();
      await openConversation(userId);
    }

    // Enter key to send
    document.getElementById('adminInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendAdminReply();
    });

    init();
  </script>
</body>
</html>
