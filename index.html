<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USAA - Access Your Account</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #002649; /* USAA Navy */
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      background-color: #ffffff;
      color: #333333;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 30px 25px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-header i {
      font-size: 40px;
      color: #002649;
    }

    .brand-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #002649;
      margin-top: 8px;
    }

    .tabs {
      display: flex;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      font-size: 16px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      color: #002649;
      border-bottom: 3px solid #002649;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      color: #333333;
    }

    .form-group input:focus {
      border-color: #002649;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #002649;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #001a33;
    }

    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 15px;
      display: none;
      word-break: break-word;
    }

    .alert.error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #f87171;
      display: block;
    }

    .alert.success {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #4ade80;
      display: block;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="brand-header">
      <i class="fa-solid fa-building-columns"></i>
      <h1>USAA</h1>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
      <button id="login-tab" class="tab-btn active">Log In</button>
      <button id="register-tab" class="tab-btn">Register</button>
    </div>

    <!-- Alert Message Box -->
    <div id="alert-box" class="alert"></div>

    <!-- LOGIN FORM -->
    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="Enter your email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-submit" id="login-btn">Log In</button>
    </form>

    <!-- REGISTRATION FORM -->
    <form id="register-form" style="display: none;">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Sarah Jenkins" required />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="reg-email" placeholder="sarah@example.com" required />
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="reg-phone" placeholder="+1 (555) 000-0000" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Create password" required />
      </div>
      <button type="submit" class="btn-submit" id="reg-btn">Create Account</button>
    </form>
  </div>

  <!-- JavaScript Module -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = "https://hzajoriyzowufebetpzv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_2VBan5zlHsacQ4fvsBiBPQ_78oaUVth";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Tab Switching Functionality
    const loginTab = document.getElementById('login-tab');
    const registerTab = document.getElementById('register-tab');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');

    function switchTab(tab) {
      showAlert('');
      if (tab === 'login') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
      }
    }

    loginTab.addEventListener('click', () => switchTab('login'));
    registerTab.addEventListener('click', () => switchTab('register'));

    function showAlert(msg, type = 'error') {
      const box = document.getElementById('alert-box');
      if (!msg) {
        box.style.display = 'none';
        return;
      }
      box.className = `alert ${type}`;
      box.innerText = msg;
    }

    // REGISTRATION HANDLER
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const regBtn = document.getElementById('reg-btn');
      regBtn.disabled = true;
      regBtn.innerText = "Creating Account...";
      showAlert('');

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;

      // Generate unique username to satisfy table constraints
      const username = email.split('@')[0] + Math.floor(Math.random() * 10000);

      try {
        // 1. Create Auth User
        const { data: authData, error: authError } = await supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: name,
              phone_number: phone,
              username: username
            }
          }
        });

        if (authError) throw authError;

        // 2. Insert User into public.profiles
        if (authData?.user) {
          const { error: profileError } = await supabase
            .from('profiles')
            .upsert({
              id: authData.user.id,
              full_name: name,
              username: username,
              phone_number: phone,
              email: email
            });

          if (profileError) {
            console.error("Profiles Table Error:", profileError);
          }
        }

        showAlert('Account created successfully! Switching to login...', 'success');
        registerForm.reset();
        setTimeout(() => switchTab('login'), 1500);

      } catch (err) {
        console.error("Registration failed:", err);
        showAlert(err.message || "Could not register. Check credentials.", 'error');
      } finally {
        regBtn.disabled = false;
        regBtn.innerText = "Create Account";
      }
    });

    // LOGIN HANDLER
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const loginBtn = document.getElementById('login-btn');
      loginBtn.disabled = true;
      loginBtn.innerText = "Logging in...";
      showAlert('');

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) throw error;

        showAlert('Login successful! Redirecting to dashboard...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);

      } catch (err) {
        console.error("Login failed:", err);
        showAlert(err.message || "Invalid email or password.", 'error');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = "Log In";
      }
    });
  </script>
</body>
</html>
