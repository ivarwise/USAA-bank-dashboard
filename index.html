<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Dashboard - Auth</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS Client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="auth-container">
    <h2>Welcome to Your Bank</h2>
    
    <!-- Tab Selector -->
    <div class="tabs">
      <button id="show-login-btn" class="active" onclick="showTab('login')">Login</button>
      <button id="show-register-btn" onclick="showTab('register')">Register</button>
    </div>

    <!-- Feedback Message Display -->
    <div id="message" class="message"></div>

    <!-- LOGIN FORM -->
    <form id="login-form">
      <h3>Login</h3>
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit">Log In</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="register-form" style="display: none;">
      <h3>Create Account</h3>
      <input type="text" id="reg-name" placeholder="Full Name" required />
      <input type="email" id="reg-email" placeholder="Email" required />
      <input type="tel" id="reg-phone" placeholder="Phone Number (+1234567890)" />
      <input type="password" id="reg-password" placeholder="Password" required />
      <button type="submit">Sign Up</button>
    </form>

    <!-- VERIFICATION CODE FORM (Shows when phone verification is triggered) -->
    <form id="verify-form" style="display: none;">
      <h3>Enter Verification Code</h3>
      <p>Please enter the OTP code sent to your phone/email.</p>
      <input type="text" id="verify-code" placeholder="6-digit code" required />
      <button type="submit">Verify Code</button>
    </form>
  </div>

  <script>
    // 1. Initialize Supabase Client
    // Replace these placeholder strings with your actual Vercel/Supabase values if needed locally, 
    // or set up window env variables when deploying.
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL"; 
    const SUPABASE_ANON_KEY = "sb_publishable_2VBan5zlHsacQ4fvsBiBPQ_78oaUVth";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // UI Helper: Toggle Forms
    function showTab(tab) {
      document.getElementById('message').innerText = '';
      if (tab === 'login') {
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('register-form').style.display = 'none';
        document.getElementById('verify-form').style.display = 'none';
        document.getElementById('show-login-btn').classList.add('active');
        document.getElementById('show-register-btn').classList.remove('active');
      } else {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('register-form').style.display = 'block';
        document.getElementById('verify-form').style.display = 'none';
        document.getElementById('show-register-btn').classList.add('active');
        document.getElementById('show-login-btn').classList.remove('active');
      }
    }

    // 2. Handle User Registration
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const phone = document.getElementById('reg-phone').value;
      const password = document.getElementById('reg-password').value;
      const msg = document.getElementById('message');

      msg.innerText = "Creating account...";

      // Sign up via Supabase Auth
      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          data: { full_name: name, phone_number: phone }
        }
      });

      if (error) {
        msg.innerText = "Error: " + error.message;
        msg.style.color = "red";
      } else {
        msg.innerText = "Registration successful! Check your email for verification link.";
        msg.style.color = "green";
      }
    });

    // 3. Handle User Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const msg = document.getElementById('message');

      msg.innerText = "Logging in...";

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        msg.innerText = "Login failed: " + error.message;
        msg.style.color = "red";
      } else {
        msg.innerText = "Login successful! Redirecting...";
        msg.style.color = "green";
        // Store user session token and redirect to Dashboard
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);
      }
    });
  </script>
</body>
</html>
