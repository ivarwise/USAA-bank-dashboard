<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>USAA - Live Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #f4f6f8;
      color: #333;
      max-width: 480px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: linear-gradient(180deg, #002244 0%, #003366 100%);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .back-btn {
      color: white;
      font-size: 20px;
      text-decoration: none;
    }

    .agent-info {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .agent-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border: 2px solid rgba(255,255,255,0.35);
    }

    .agent-details h2 {
      font-size: 16px;
      font-weight: 700;
    }

    .agent-status {
      font-size: 12px;
      color: #a8d5a2;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #4caf50;
      border-radius: 50%;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #eef2f5;
    }

    .message {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.45;
      position: relative;
      word-wrap: break-word;
    }

    .message.user {
      background: #002244;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.admin {
      background: white;
      border: 1px solid #e1e8ed;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .message img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 6px;
      display: block;
    }

    .message-time {
      font-size: 10px;
      margin-top: 4px;
      opacity: 0.7;
    }

    .message.user .message-time {
      text-align: right;
      color: rgba(255,255,255,0.75);
    }

    .message.admin .message-time {
      color: #657786;
    }

    .chat-input-area {
      background: white;
      border-top: 1px solid #e1e8ed;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .attach-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #f1f5f9;
      border: none;
      color: #002244;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .chat-input {
      flex: 1;
      border: 1px solid #d1dbe5;
      border-radius: 24px;
      padding: 11px 16px;
      font-size: 15px;
      outline: none;
      background: #f8fafc;
    }

    .chat-input:focus {
      border-color: #002244;
      background: white;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #002244;
      color: white;
      border: none;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .send-btn:disabled {
      background: #94a3b8;
    }

    .system-msg {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin: 8px 0;
    }

    #imagePreview {
      display: none;
      padding: 8px 12px;
      background: white;
      border-top: 1px solid #e1e8ed;
    }

    #imagePreview img {
      max-height: 80px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="chat-header">
    <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="agent-info">
      <div class="agent-avatar"><i class="fa-solid fa-headset"></i></div>
      <div class="agent-details">
        <h2>USAA Support</h2>
        <div class="agent-status">
          <span class="status-dot"></span>
          Online
        </div>
      </div>
    </div>
  </div>

  <div class="chat-body" id="chatBody">
    <div class="system-msg">Today</div>
  </div>

  <div id="imagePreview">
    <img id="previewImg" src="">
  </div>

  <div class="chat-input-area">
    <button class="attach-btn" onclick="document.getElementById('imageInput').click()">
      <i class="fa-solid fa-paperclip"></i>
    </button>
    <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="previewImage(event)">
    <input type="text" class="chat-input" id="messageInput" placeholder="Type a message..." autocomplete="off">
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>

  <script>
    const SUPABASE_URL = "https://hzajoriyzowufebetpzv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_2VBan5zlHsacQ4fvsBiBPQ_78oaUVth";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let selectedImage = null;

    async function init() {
      const { data: { user } } = await client.auth.getUser();
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = user;

      await loadMessages();
      subscribeToMessages();
    }

    async function loadMessages() {
      const { data, error } = await client
        .from('chat_messages')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: true });

      if (error) {
        console.error(error);
        return;
      }

      const chatBody = document.getElementById('chatBody');
      // Keep the "Today" system message
      chatBody.innerHTML = '<div class="system-msg">Today</div>';

      if (data && data.length > 0) {
        data.forEach(msg => renderMessage(msg));
      } else {
        // Welcome message
        renderMessage({
          sender_type: 'admin',
          message: 'Hi! Welcome to USAA Live Chat. How can we help you today?',
          created_at: new Date().toISOString()
        });
      }

      scrollToBottom();
    }

    function renderMessage(msg) {
      const chatBody = document.getElementById('chatBody');
      const div = document.createElement('div');
      div.className = `message ${msg.sender_type === 'user' ? 'user' : 'admin'}`;

      let content = '';
      if (msg.message) {
        content += msg.message;
      }
      if (msg.image_url) {
        content += `<img src="${msg.image_url}" alt="Photo">`;
      }

      const time = new Date(msg.created_at).toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit'
      });

      div.innerHTML = `${content}<div class="message-time">${time}</div>`;
      chatBody.appendChild(div);
    }

    function subscribeToMessages() {
      client
        .channel('chat-messages')
        .on(
          'postgres_changes',
          {
            event: 'INSERT',
            schema: 'public',
            table: 'chat_messages',
            filter: `user_id=eq.${currentUser.id}`
          },
          (payload) => {
            renderMessage(payload.new);
            scrollToBottom();
          }
        )
        .subscribe();
    }

    function previewImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      selectedImage = file;
      const reader = new FileReader();
      reader.onload = function(ev) {
        document.getElementById('previewImg').src = ev.target.result;
        document.getElementById('imagePreview').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      const btn = document.getElementById('sendBtn');

      if (!text && !selectedImage) return;

      btn.disabled = true;

      try {
        let imageUrl = null;

        // Upload image if selected
        if (selectedImage) {
          const fileName = `${currentUser.id}/${Date.now()}_${selectedImage.name}`;
          const { data: uploadData, error: uploadError } = await client.storage
            .from('chat-images')
            .upload(fileName, selectedImage);

          if (uploadError) throw uploadError;

          const { data: publicUrl } = client.storage
            .from('chat-images')
            .getPublicUrl(fileName);

          imageUrl = publicUrl.publicUrl;
        }

        // Insert message
        const { error } = await client.from('chat_messages').insert([{
          user_id: currentUser.id,
          sender_type: 'user',
          message: text || null,
          image_url: imageUrl
        }]);

        if (error) throw error;

        // Reset
        input.value = '';
        selectedImage = null;
        document.getElementById('imageInput').value = '';
        document.getElementById('imagePreview').style.display = 'none';

      } catch (err) {
        console.error(err);
        alert('Failed to send message: ' + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    function scrollToBottom() {
      const chatBody = document.getElementById('chatBody');
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    // Enter key
    document.getElementById('messageInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });

    init();
  </script>
</body>
</html>
