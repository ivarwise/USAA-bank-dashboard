<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>USAA - Transaction Details</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f4f6f8;
      color: #333;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    .header {
      background: linear-gradient(180deg, #002244 0%, #003366 100%);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: 600;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .container {
      padding: 20px 16px 40px;
    }

    .receipt-card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      border: 1px solid #e1e8ed;
      overflow: hidden;
    }

    .receipt-top {
      background: #002244;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    .receipt-top .status {
      display: inline-block;
      background: #2e7d32;
      color: white;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .receipt-top .amount {
      font-size: 32px;
      font-weight: 800;
      margin: 8px 0 4px;
    }

    .receipt-top .amount.negative {
      color: #ff6b6b;
    }

    .receipt-top .amount.positive {
      color: #69f0ae;
    }

    .receipt-top .merchant {
      font-size: 16px;
      font-weight: 600;
      opacity: 0.95;
    }

    .receipt-top .date {
      font-size: 13px;
      opacity: 0.75;
      margin-top: 6px;
    }

    .details-section {
      padding: 20px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #f0f4f8;
      font-size: 14px;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: #657786;
      font-weight: 500;
    }

    .detail-value {
      color: #002244;
      font-weight: 700;
      text-align: right;
      max-width: 60%;
      word-break: break-word;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #002244;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin: 24px 0 12px;
      padding-left: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #657786;
    }

    .empty-state i {
      font-size: 48px;
      margin-bottom: 16px;
      color: #cbd5e1;
    }

    .btn-back {
      display: block;
      width: 100%;
      background: #002244;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      margin-top: 24px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .btn-back:hover {
      background: #003366;
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <h1>Transaction Details</h1>
  </div>

  <div class="container">
    <div id="receipt-content">
      <div class="empty-state">
        <i class="fa-solid fa-receipt"></i>
        <p>Loading transaction details...</p>
      </div>
    </div>
  </div>

  <script>
    const txData = sessionStorage.getItem('selectedTransaction');

    if (!txData) {
      document.getElementById('receipt-content').innerHTML = `
        <div class="empty-state">
          <i class="fa-solid fa-circle-exclamation"></i>
          <p>No transaction selected.</p>
          <a href="dashboard.html" class="btn-back" style="margin-top: 24px; display: inline-block; width: auto; padding: 12px 28px;">Back to Dashboard</a>
        </div>
      `;
    } else {
      const tx = JSON.parse(txData);

      const isPositive = tx.amount > 0;
      const amountClass = isPositive ? 'positive' : 'negative';
      const formattedAmount = `${isPositive ? '+' : '-'}${new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD'
      }).format(Math.abs(tx.amount || 0))}`;

      const dateObj = tx.transaction_date ? new Date(tx.transaction_date) : null;
      const fullDate = dateObj
        ? dateObj.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
        : '—';
      const fullTime = dateObj
        ? dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
        : '—';

      document.getElementById('receipt-content').innerHTML = `
        <div class="receipt-card">
          <div class="receipt-top">
            <div class="status">${isPositive ? 'CREDIT' : 'DEBIT'} • COMPLETED</div>
            <div class="amount ${amountClass}">${formattedAmount}</div>
            <div class="merchant">${tx.merchant_name || 'Transaction'}</div>
            <div class="date">${fullDate}</div>
          </div>

          <div class="details-section">
            <div class="detail-row">
              <span class="detail-label">Date</span>
              <span class="detail-value">${fullDate}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Time</span>
              <span class="detail-value">${fullTime}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Type</span>
              <span class="detail-value">${(tx.type || 'transfer').toUpperCase()}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Merchant / Bank</span>
              <span class="detail-value">${tx.merchant_name || '—'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Recipient</span>
              <span class="detail-value">${tx.recipient_name || '—'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Description</span>
              <span class="detail-value">${tx.description || '—'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Amount</span>
              <span class="detail-value">${formattedAmount}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Transaction ID</span>
              <span class="detail-value" style="font-size: 12px; word-break: break-all;">${tx.id || '—'}</span>
            </div>
          </div>
        </div>

        <a href="dashboard.html" class="btn-back">Back to Dashboard</a>
      `;
    }
  </script>
</body>
</html>
