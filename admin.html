<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USAA - Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body {
      background: #f4f6f8;
      color: #333;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #002244, #003366);
      color: white;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header a { color: #a8c0d8; text-decoration: none; font-size: 14px; }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      padding: 24px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 18px;
      color: #002244;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }
    .search-box input {
      flex: 1;
      padding: 13px 16px;
      border: 1px solid #d1dbe5;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    .search-box input:focus { border-color: #002244; }
    .search-box button {
      background: #002244;
      color: white;
      border: none;
      padding: 0 22px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
    }

    .user-result {
      margin-top: 20px;
      padding: 16px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      display: none;
    }
    .user-result.active { display: block; }

    .user-info {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #002244;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
    }
    .user-details h3 { font-size: 17px; color: #002244; }
    .user-details p { font-size: 13px; color: #64748b; margin-top: 2px; }

    .accounts-list { margin-top: 10px; }
    .account-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #e2e8f0;
    }
    .account-item:last-child { border-bottom: none; }
    .acc-name { font-weight: 600; color: #002244; }
    .acc-balance { font-weight: 700; font-size: 16px; color: #002244; }
    .acc-type { font-size: 12px; color: #64748b; }

    .topup-form {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
      display: none;
    }
    .topup-form.active { display: block; }

    .form-row {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .form-group {
      flex: 1;
      min-width: 180px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }
    .form-group select, .form-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #d1dbe5;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    .form-group select:focus, .form-group input:focus { border-color: #002244; }

    .btn-topup {
      background: #002244;
      color: white;
      border: none;
      padding: 13px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }
    .btn-topup:hover { background: #003366; }
    .btn-topup:disabled { background: #94a3b8; cursor: not-allowed; }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      display: none;
    }
    .alert.success { background: #dcfce7; color: #166534; border: 1px solid #86efac; display: block; }
    .alert.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; display: block; }

    .no-result {
      text-align: center;
      padding: 30px;
      color: #64748b;
      display: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1><i class="fa-solid fa-shield-halved"></i> USAA Admin Panel</h1>
    <a href="admin-chat.html">← Back to Live Chat</a>
  </div>

  <div class="container">

    <div class="card">
      <h2><i class="fa-solid fa-magnifying-glass"></i> Search User</h2>
      
      <div id="alertBox" class="alert"></div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Enter Name, Email or User ID..." onkeypress="if(event.key==='Enter') searchUser()">
        <button onclick="searchUser()">Search</button>
      </div>

      <div class="no-result" id="noResult">No user found. Try another name or email.</div>

      <div class="user-result" id="userResult">
        <div class="user-info">
          <div class="avatar" id="userAvatar">US</div>
          <div class="user-details">
            <h3 id="userName">—</h3>
            <p id="userEmail">—</p>
            <p id="userId" style="font-size:12px;color:#94a3b8;"></p>
          </div>
        </div>

        <div class="accounts-list" id="accountsList"></div>

        <div class="topup-form" id="topupForm">
          <h3 style="font-size:15px;color:#002244;margin-bottom:14px;">Add Balance (Top-Up)</h3>
          
          <div class="form-row">
            <div class="form-group">
              <label>Select Account</label>
              <select id="accountSelect"></select>
            </div>
            <div class="form-group">
              <label>Amount to Add ($)</label>
              <input type="number" id="topupAmount" placeholder="0.00" min="1" step="0.01">
            </div>
          </div>

          <div class="form-group">
            <label>Description (optional)</label>
            <input type="text" id="topupNote" placeholder="e.g. Manual credit / Salary deposit">
          </div>

          <button class="btn-topup" id="topupBtn" onclick="addBalance()">Add Balance</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://hzajoriyzowufebetpzv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_2VBan5zlHsacQ4fvsBiBPQ_78oaUVth";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let userAccounts = [];

    function showAlert(msg, type = 'success') {
      const box = document.getElementById('alertBox');
      box.className = `alert ${type}`;
      box.textContent = msg;
      box.style.display = 'block';
      setTimeout(() => box.style.display = 'none', 4000);
    }

    function getInitials(name) {
      if (!name) return "US";
      const parts = name.trim().split(" ");
      return parts.length >= 2 ? (parts[0][0] + parts[1][0]).toUpperCase() : name.substring(0, 2).toUpperCase();
    }

    async function searchUser() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) {
        showAlert('Please enter a name, email or user ID', 'error');
        return;
      }

      document.getElementById('userResult').classList.remove('active');
      document.getElementById('noResult').style.display = 'none';
      document.getElementById('topupForm').classList.remove('active');

      let profiles = [];

      // Check if the query looks like a UUID
      const isUUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(query);

      if (isUUID) {
        // Search by exact ID
        const { data, error } = await client
          .from('profiles')
          .select('*')
          .eq('id', query);
        
        if (error) {
          showAlert('Search error: ' + error.message, 'error');
          return;
        }
        profiles = data || [];
      } else {
        // Search by name or email only
        const { data, error } = await client
          .from('profiles')
          .select('*')
          .or(`full_name.ilike.%${query}%,email.ilike.%${query}%`);
        
        if (error) {
          showAlert('Search error: ' + error.message, 'error');
          return;
        }
        profiles = data || [];
      }

      if (!profiles || profiles.length === 0) {
        document.getElementById('noResult').style.display = 'block';
        return;
      }

      // Take the first match
      currentUser = profiles[0];
      displayUser(currentUser);
    }

    async function displayUser(user) {
      document.getElementById('userAvatar').textContent = getInitials(user.full_name);
      document.getElementById('userName').textContent = user.full_name || 'No Name';
      document.getElementById('userEmail').textContent = user.email || 'No email';
      document.getElementById('userId').textContent = 'ID: ' + user.id;

      // Load accounts
      const { data: accounts, error } = await client
        .from('accounts')
        .select('*')
        .eq('user_id', user.id)
        .order('account_type');

      if (error) {
        showAlert('Error loading accounts: ' + error.message, 'error');
        return;
      }

      userAccounts = accounts || [];
      const list = document.getElementById('accountsList');
      const select = document.getElementById('accountSelect');

      if (userAccounts.length === 0) {
        list.innerHTML = `<p style="color:#64748b;padding:10px 0;">No accounts found for this user.</p>`;
        select.innerHTML = '';
        document.getElementById('topupForm').classList.remove('active');
      } else {
        list.innerHTML = userAccounts.map(acc => `
          <div class="account-item">
            <div>
              <div class="acc-name">${acc.account_name}</div>
              <div class="acc-type">${acc.account_type} • •••• ${acc.account_number_last4 || '0000'}</div>
            </div>
            <div class="acc-balance">$${parseFloat(acc.balance || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
          </div>
        `).join('');

        select.innerHTML = userAccounts.map(acc => 
          `<option value="${acc.id}">${acc.account_name} ($${parseFloat(acc.balance || 0).toFixed(2)})</option>`
        ).join('');

        document.getElementById('topupForm').classList.add('active');
      }

      document.getElementById('userResult').classList.add('active');
    }

    async function addBalance() {
      const accountId = document.getElementById('accountSelect').value;
      const amount = parseFloat(document.getElementById('topupAmount').value);
      const note = document.getElementById('topupNote').value.trim() || 'Admin balance top-up';

      if (!accountId) {
        showAlert('Please select an account', 'error');
        return;
      }
      if (!amount || amount <= 0) {
        showAlert('Please enter a valid amount', 'error');
        return;
      }

      const btn = document.getElementById('topupBtn');
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        // Get current balance
        const account = userAccounts.find(a => a.id === accountId);
        const newBalance = parseFloat(account.balance || 0) + amount;

        // Update balance
        const { error: updateError } = await client
          .from('accounts')
          .update({ balance: newBalance })
          .eq('id', accountId);

        if (updateError) throw updateError;

        // Create transaction record
        await client.from('transactions').insert([{
          user_id: currentUser.id,
          account_id: accountId,
          merchant_name: 'USAA Credit',
          amount: amount,
          transaction_date: new Date().toISOString(),
          description: note,
          type: 'credit',
          status: 'completed'
        }]);

        showAlert(`Successfully added $${amount.toFixed(2)} to ${account.account_name}`);
        
        // Refresh display
        document.getElementById('topupAmount').value = '';
        document.getElementById('topupNote').value = '';
        await displayUser(currentUser);

      } catch (err) {
        console.error(err);
        showAlert('Error: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Add Balance';
      }
    }
  </script>
</body>
</html>
